openapi: 3.2.0
info:
  title: Runn Rate Cards API
  version: 1.0.0
  description: 'See the full documentation and guide to using the Runn API.


    The domain for your API endpoint can be found in Accounts > Settings > API in your Runn application'
servers:
- url: https://api.runn.io
  description: EU Server
- url: https://api.us.runn.io
  description: US Server
security:
- bearerAuth: []
tags:
- name: Rate Cards
paths:
  /rate-cards/:
    get:
      operationId: listRateCards
      summary: List rate cards
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Cursor for paginated requests
      - schema:
          default: 50
          minimum: 1
          maximum: 200
          type: integer
        in: query
        name: limit
        required: false
        description: The number of results per page
      - schema:
          type: string
          enum:
          - createdAt
          - updatedAt
          - id
          default: id
        in: query
        name: sortBy
        required: false
        description: 'Field to sort by: createdAt or updatedAt or id'
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        in: query
        name: order
        required: false
        description: 'Sort order: asc or desc'
      - schema:
          $ref: '#/components/schemas/ModifiedAfter'
        in: query
        name: modifiedAfter
        required: false
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      $ref: '#/components/schemas/RateCard'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - values
                - nextCursor
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      tags:
      - Rate Cards
    post:
      operationId: createRateCard
      summary: Create a rate card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true
                references:
                  type: array
                  items:
                    type: object
                    properties:
                      referenceName:
                        type: string
                      externalId:
                        type: string
                    required:
                    - referenceName
                    - externalId
                isBlendedRateCard:
                  type: boolean
                blendedRate:
                  type: number
                  nullable: true
                rateType:
                  type: string
                  enum:
                  - hours
                  - days
                  nullable: true
              required:
              - name
              - description
              - references
              - isBlendedRateCard
              - blendedRate
              - rateType
      parameters:
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateCard'
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      tags:
      - Rate Cards
  /rate-cards/{rateCardId}:
    get:
      operationId: getRateCard
      summary: Show a rate card
      parameters:
      - schema:
          type: integer
        in: path
        name: rateCardId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateCard'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - Rate Cards
    delete:
      operationId: deleteRateCard
      summary: Delete a rate card
      description: Rate cards that are internal, standard, or have projects cannot be deleted
      parameters:
      - schema:
          type: integer
        in: path
        name: rateCardId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '204':
          description: Default Response
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - Rate Cards
    patch:
      operationId: updateRateCard
      summary: Update a rate card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                  nullable: true
                references:
                  type: array
                  items:
                    type: object
                    properties:
                      referenceName:
                        type: string
                      externalId:
                        type: string
                    required:
                    - referenceName
                    - externalId
                isBlendedRateCard:
                  type: boolean
                blendedRate:
                  minimum: 0
                  type: number
                  nullable: true
                rateType:
                  type: string
                  enum:
                  - hours
                  - days
      parameters:
      - schema:
          type: integer
        in: path
        name: rateCardId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RateCard'
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - Rate Cards
components:
  schemas:
    ModifiedAfter:
      description: 'If provided, will only return objects modified after this timestamp. Format: YYYY-MM-DD or YYYY-MM-DDTHH:MM:SSZ.'
      anyOf:
      - format: date
        type: string
      - format: date-time
        type: string
    BadRequest:
      type: object
      properties:
        error:
          type: string
          enum:
          - Bad Request
        message:
          type: string
        statusCode:
          type: number
          enum:
          - 400
      required:
      - error
      - message
      - statusCode
    NotFound:
      type: object
      properties:
        error:
          type: string
          enum:
          - Not Found
        message:
          type: string
        statusCode:
          type: number
          enum:
          - 404
      required:
      - error
      - message
      - statusCode
    RateCard:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        isArchived:
          type: boolean
        references:
          type: array
          items:
            type: object
            properties:
              referenceName:
                type: string
              externalId:
                type: string
            required:
            - referenceName
            - externalId
        isBlendedRateCard:
          type: boolean
        blendedRate:
          type: number
          nullable: true
        rateType:
          type: string
          enum:
          - hours
          - days
          nullable: true
        projectIds:
          type: array
          items:
            type: integer
        rates:
          type: array
          items:
            type: object
            properties:
              role:
                type: object
                properties:
                  id:
                    type: number
                  name:
                    type: string
                required:
                - id
                - name
              rateHourly:
                type: number
              rateDaily:
                type: number
            required:
            - role
            - rateHourly
            - rateDaily
        createdAt:
          type: string
          format: date-time
          description: Timestamp of when the object was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of when the object was last updated.
      required:
      - id
      - name
      - description
      - isArchived
      - references
      - isBlendedRateCard
      - blendedRate
      - rateType
      - projectIds
      - rates
      - createdAt
      - updatedAt
    Unauthorized:
      type: object
      properties:
        error:
          type: string
          enum:
          - Unauthorized
        message:
          type: string
          enum:
          - Unauthorized
        statusCode:
          type: number
          enum:
          - 401
      required:
      - error
      - message
      - statusCode
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
x-readme:
  proxy-enabled: false
