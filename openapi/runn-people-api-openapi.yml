components:
  schemas:
    CustomDateFieldCollection:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - date
        customDateId:
          type: integer
        value:
          type: string
          format: date
          description: 'Format: YYYY-MM-DD'
          nullable: true
      required:
      - name
      - type
      - customDateId
      - value
    BadRequest:
      type: object
      properties:
        error:
          type: string
          enum:
          - Bad Request
        message:
          type: string
        statusCode:
          type: number
          enum:
          - 400
      required:
      - error
      - message
      - statusCode
    CustomCheckboxFieldCollection:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - checkbox
        customCheckboxId:
          type: integer
        value:
          type: boolean
      required:
      - name
      - type
      - customCheckboxId
      - value
    PersonCompetency:
      type: object
      allOf:
      - type: object
        properties:
          personId:
            type: integer
        required:
        - personId
      - type: object
        properties:
          level:
            anyOf:
            - type: number
              enum:
              - 1
              nullable: true
            - type: number
              enum:
              - 2
              nullable: true
            - type: number
              enum:
              - 3
              nullable: true
            - type: number
              enum:
              - 4
              nullable: true
          skillId:
            type: integer
          createdAt:
            type: string
            format: date-time
            description: Timestamp of when the object was created.
          updatedAt:
            type: string
            format: date-time
            description: Timestamp of when the object was last updated.
        required:
        - skillId
        - createdAt
        - updatedAt
    TimeOff:
      type: object
      properties:
        id:
          description: The unique identifier for the assignment.
          type: integer
        personId:
          description: The identifier referencing the person associated with the time-off.
          type: integer
        startDate:
          type: string
          format: date
          description: 'The start date of the time-off. Format: YYYY-MM-DD'
        endDate:
          type: string
