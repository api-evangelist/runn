openapi: 3.2.0
info:
  title: Runn People API
  version: 1.0.0
  description: 'See the full documentation and guide to using the Runn API.


    The domain for your API endpoint can be found in Accounts > Settings > API in your Runn application'
servers:
- url: https://api.runn.io
  description: EU Server
- url: https://api.us.runn.io
  description: US Server
security:
- bearerAuth: []
tags:
- name: People
paths:
  /people/{personId}:
    get:
      operationId: getPerson
      summary: Show a person or placeholder
      parameters:
      - schema:
          type: integer
        in: path
        name: personId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - People
    patch:
      operationId: updatePerson
      summary: Update a person or placeholder
      description: 'To add a new role or job title to a person, see POST /people/{personId}/contracts. Archiving a person (isArchived: true) fails while they have ongoing or future contracts. Add an end date to each ongoing contract via PATCH /people/{personId}/contracts/{contractId}, and delete any contract that starts in the future via DELETE /people/{personId}/contracts/{contractId}, before archiving.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  minLength: 1
                  maxLength: 100
                  type: string
                lastName:
                  minLength: 1
                  maxLength: 100
                  type: string
                email:
                  type: string
                tags:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                    required:
                    - id
                teamId:
                  type: integer
                  nullable: true
                references:
                  type: array
                  items:
                    $ref: '#/components/schemas/Reference'
                isArchived:
                  type: boolean
                managers:
                  type: array
                  items:
                    type: object
                    properties:
                      userId:
                        type: integer
                    required:
                    - userId
      parameters:
      - schema:
          type: integer
        in: path
        name: personId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - People
    delete:
      operationId: deletePerson
      summary: Delete a person or placeholder
      description: 'Delete a person or placeholder by their ID; fails when person has existing assignments or actuals to preserve

        historical reports. Override this behaviour by using the force query flag.'
      parameters:
      - schema:
          default: false
          type: boolean
        in: query
        name: force
        required: true
      - schema:
          type: integer
        in: path
        name: personId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '204':
          description: Default Response
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - People
  /people/:
    get:
      operationId: listPeople
      summary: List people
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Cursor for paginated requests
      - schema:
          default: 50
          minimum: 1
          maximum: 200
          type: integer
        in: query
        name: limit
        required: false
        description: The number of results per page
      - schema:
          type: string
          enum:
          - createdAt
          - updatedAt
          - id
          default: id
        in: query
        name: sortBy
        required: false
        description: 'Field to sort by: createdAt or updatedAt or id'
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        in: query
        name: order
        required: false
        description: 'Sort order: asc or desc'
      - schema:
          default: false
          type: boolean
        in: query
        name: includePlaceholders
        required: false
      - schema:
          type: string
        in: query
        name: email
        required: false
        description: If provided, will only return people with an email that are a substring of this value (case-insensitive).
      - schema:
          type: string
        in: query
        name: firstName
        required: false
        description: If provided, will only return people with a first name that is a substring of this value (case-insensitive).
      - schema:
          type: string
        in: query
        name: lastName
        required: false
        description: If provided, will only return people with a last name that is a substring of this value (case-insensitive).
      - schema:
          $ref: '#/components/schemas/ModifiedAfter'
        in: query
        name: modifiedAfter
        required: false
      - schema:
          type: string
        in: query
        name: externalId
        required: false
        description: External ID value
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      $ref: '#/components/schemas/CollectionPerson'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - values
                - nextCursor
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - People
    post:
      operationId: createPerson
      summary: Create a person
      description: Also creates a new contract for the person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstName:
                  minLength: 1
                  maxLength: 100
                  type: string
                lastName:
                  minLength: 1
                  maxLength: 100
                  type: string
                email:
                  type: string
                teamId:
                  type: integer
                  nullable: true
                holidaysGroupId:
                  type: integer
                tags:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                    required:
                    - id
                references:
                  type: array
                  items:
                    $ref: '#/components/schemas/Reference'
                managers:
                  type: array
                  items:
                    type: object
                    properties:
                      userId:
                        type: integer
                    required:
                    - userId
                roleId:
                  type: integer
                startDate:
                  type: string
                  format: date
                  description: 'Defaults to today. Format: YYYY-MM-DD'
                endDate:
                  type: string
                  format: date
                  description: 'Format: YYYY-MM-DD'
                employmentType:
                  type: string
                  enum:
                  - employee
                  - contractor
                  description: The type of employment for the contract.
                  default: employee
                costPerHour:
                  description: Defaults to the role's cost per hour
                  type: number
                minutesPerDay:
                  minimum: 1
                  description: Defaults to the account's default minutes per day
                  type: number
                rosteredDays:
                  description: Every value must be the same as minutesPerDay or 0.
                  type: object
                  properties:
                    monday:
                      type: number
                    tuesday:
                      type: number
                    wednesday:
                      type: number
                    thursday:
                      type: number
                    friday:
                      type: number
                  required:
                  - monday
                  - tuesday
                  - wednesday
                  - thursday
                  - friday
                jobTitle:
                  description: This feature is currently hidden, and can not be seen in the app
                  type: string
              required:
              - firstName
              - lastName
              - roleId
      parameters:
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      tags:
      - People
  /people/skills:
    get:
      operationId: listPeopleSkills
      summary: List people skills
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Cursor for paginated requests
      - schema:
          default: 50
          minimum: 1
          maximum: 200
          type: integer
        in: query
        name: limit
        required: false
        description: The number of results per page
      - schema:
          default: false
          type: boolean
        in: query
        name: includePlaceholders
        required: false
      - schema:
          $ref: '#/components/schemas/ModifiedAfter'
        in: query
        name: modifiedAfter
        required: false
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonCompetency'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - values
                - nextCursor
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - People
  /people/notes:
    get:
      operationId: listPeopleNotes
      summary: List people notes
      description: List all person notes across all people
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Cursor for paginated requests
      - schema:
          default: 100
          minimum: 1
          maximum: 500
          type: integer
        in: query
        name: limit
        required: false
        description: The number of results per page
      - schema:
          $ref: '#/components/schemas/ModifiedAfter'
        in: query
        name: modifiedAfter
        required: false
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonNote'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - values
                - nextCursor
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      tags:
      - People
  /people/contracts/current:
    get:
      operationId: listPeopleCurrentContracts
      summary: List people current contracts
      description: List current contracts across all people
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Cursor for paginated requests
      - schema:
          default: 100
          minimum: 1
          maximum: 500
          type: integer
        in: query
        name: limit
        required: false
        description: The number of results per page
      - schema:
          $ref: '#/components/schemas/ModifiedAfter'
        in: query
        name: modifiedAfter
        required: false
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contract'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - values
                - nextCursor
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      tags:
      - People
  /people/custom-fields:
    get:
      operationId: listPeopleCustomFields
      summary: List people custom fields
      description: List all custom fields across all people
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Cursor for paginated requests
      - schema:
          default: 100
          minimum: 1
          maximum: 500
          type: integer
        in: query
        name: limit
        required: false
        description: The number of results per page
      - schema:
          $ref: '#/components/schemas/ModifiedAfter'
        in: query
        name: modifiedAfter
        required: false
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      $ref: '#/components/schemas/PersonCustomField'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - values
                - nextCursor
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      tags:
      - People
  /people/{personId}/actuals/:
    get:
      operationId: listPersonActuals
      summary: List actuals for a person
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Cursor for paginated requests
      - schema:
          default: 50
          minimum: 1
          maximum: 200
          type: integer
        in: query
        name: limit
        required: false
        description: The number of results per page
      - schema:
          type: integer
        in: query
        name: projectId
        required: false
      - schema:
          type: integer
        in: query
        name: roleId
        required: false
      - schema:
          $ref: '#/components/schemas/ModifiedAfter'
        in: query
        name: modifiedAfter
        required: false
      - schema:
          type: integer
        in: path
        name: personId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      $ref: '#/components/schemas/Actual'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - values
                - nextCursor
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - People
  /people/{personId}/assignments/:
    get:
      operationId: listPersonAssignments
      summary: List assignments for a person or placeholder
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Cursor for paginated requests
      - schema:
          default: 50
          minimum: 1
          maximum: 200
          type: integer
        in: query
        name: limit
        required: false
        description: The number of results per page
      - schema:
          type: integer
        in: query
        name: projectId
        required: false
      - schema:
          type: integer
        in: query
        name: roleId
        required: false
      - schema:
          type: string
          format: date
        in: query
        name: startDate
        required: false
        description: 'Include assignments that start or overlap with this date. Format: YYYY-MM-DD'
      - schema:
          type: string
          format: date
        in: query
        name: endDate
        required: false
        description: 'Include assignments that end on or overlap with this date. Format: YYYY-MM-DD'
      - schema:
          $ref: '#/components/schemas/ModifiedAfter'
        in: query
        name: modifiedAfter
        required: false
      - schema:
          type: integer
        in: path
        name: personId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assignment'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - values
                - nextCursor
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - People
  /people/{personId}/contracts/:
    get:
      operationId: listPersonContracts
      summary: List contracts for a person
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Cursor for paginated requests
      - schema:
          default: 20
          minimum: 1
          maximum: 50
          type: integer
        in: query
        name: limit
        required: false
        description: The number of results per page
      - schema:
          type: integer
        in: path
        name: personId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contract'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - values
                - nextCursor
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      tags:
      - People
    post:
      operationId: createPersonContract
      summary: Add a new contract to a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContractInput'
      parameters:
      - schema:
          type: integer
        in: path
        name: personId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - People
  /people/{personId}/contracts/current:
    get:
      operationId: getPersonCurrentContract
      summary: Show current contract for a person
      parameters:
      - schema:
          type: integer
        in: path
        name: personId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contract'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    enum:
                    - Not Found
                  message:
                    type: string
                  statusCode:
                    type: number
                    enum:
                    - 404
                required:
                - error
                - message
                - statusCode
      tags:
      - People
  /people/{personId}/contracts/{contractId}:
    delete:
      operationId: deletePersonContract
      summary: Delete a contract for a person
      parameters:
      - schema:
          type: integer
        in: path
        name: personId
        required: true
      - schema:
          type: integer
        in: path
        name: contractId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '204':
          description: Default Response
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - People
    patch:
      operationId: updatePersonContract
      summary: Update a contract for a person
      description: Update one of a person's contracts. Adding an end date to an ongoing contract here lets the person be archived (see PATCH /people/{personId}).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roleId:
                  type: integer
                startDate:
                  type: string
                  format: date
                  description: 'Defaults to today. Format: YYYY-MM-DD'
                endDate:
                  type: string
                  format: date
                  description: 'Format: YYYY-MM-DD'
                  nullable: true
                employmentType:
                  type: string
                  enum:
                  - employee
                  - contractor
                  description: The type of employment for the contract.
                  default: employee
                costPerHour:
                  description: Defaults to the role's cost per hour
                  type: number
                minutesPerDay:
                  minimum: 1
                  description: Defaults to the account's default minutes per day
                  type: number
                rosteredDays:
                  description: Every value must be the same as minutesPerDay or 0.
                  type: object
                  properties:
                    monday:
                      type: number
                    tuesday:
                      type: number
                    wednesday:
                      type: number
                    thursday:
                      type: number
                    friday:
                      type: number
                  required:
                  - monday
                  - tuesday
                  - wednesday
                  - thursday
                  - friday
                jobTitle:
                  description: This feature is currently hidden, and can not be seen in the app
                  type: string
      parameters:
      - schema:
