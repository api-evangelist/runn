components:
  schemas:
    CustomFieldDate:
      type: object
      properties:
        id:
          description: Unique identifier for the custom field date
          type: integer
        name:
          description: Display name for the custom field date
          type: string
        description:
          description: Description for the custom field date
          type: string
          nullable: true
        model:
          type: string
          enum:
          - PERSON
          - PROJECT
          description: The field type of the custom field
        required:
          description: Whether or not the date is a required field
          type: boolean
        showInPlanner:
          description: Whether or not the custom field date is shown in the project or person planner in the app UI
          type: boolean
        sortOrder:
          description: The sort order of the custom field date
          type: integer
        filterableInPlanner:
          description: Whether or not the custom field select is filterable in the project or person planner in the app UI
          type: boolean
      required:
      - id
      - name
      - description
      - model
      - required
      - showInPlanner
      - sortOrder
      - filterableInPlanner
    NotFound:
      type: object
      properties:
        error:
          type: string
          enum:
          - Not Found
        message:
          type: string
        statusCode:
          type: number
          enum:
          - 404
      required:
      - error
      - message
      - statusCode
