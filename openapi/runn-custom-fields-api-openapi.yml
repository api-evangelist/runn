                  - PERSON
                  - PROJECT
                  description: The field type of the custom field
                required:
                  default: false
                  type: boolean
                showInPlanner:
                  default: false
                  type: boolean
                filterableInPlanner:
                  default: true
                  type: boolean
              required:
              - name
              - model
              - required
