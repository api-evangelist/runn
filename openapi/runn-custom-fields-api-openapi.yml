          type: string
          enum:
          - PERSON
          - PROJECT
        in: query
        name: model
        required: false
        description: The field type of the custom field
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      $ref: '#/components/schemas/CustomFieldCheckbox'
                  nextCursor:
