components:
  schemas:
    ProjectCustomField:
      type: object
      properties:
        projectId:
          type: integer
        customFields:
          type: array
          items:
            discriminator:
              propertyName: type
              mapping:
                text: '#/components/schemas/CustomTextFieldCollection'
                date: '#/components/schemas/CustomDateFieldCollection'
                checkbox: '#/components/schemas/CustomCheckboxFieldCollection'
                select: '#/components/schemas/CustomSelectFieldCollection'
            anyOf:
            - $ref: '#/components/schemas/CustomTextFieldCollection'
            - $ref: '#/components/schemas/CustomDateFieldCollection'
            - $ref: '#/components/schemas/CustomCheckboxFieldCollection'
            - $ref: '#/components/schemas/CustomSelectFieldCollection'
        createdAt:
          type: string
          format: date-time
          description: Timestamp of when the object was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of when the object was last updated.
      required:
      - projectId
      - customFields
      - createdAt
      - updatedAt
    CustomSelectFieldCollection:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - select
        customSelectId:
          type: integer
        value:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              name:
                type: string
            required:
            - id
            - name
      required:
      - name
      - type
      - customSelectId
      - value
    ProjectNote:
      type: object
      properties:
        id:
          type: integer
        createdBy:
          type: string
          nullable: true
        createdByEmail:
          type: string
          nullable: true
        note:
          type: string
        projectId:
          type: integer
        createdAt:
          type: string
          format: date-time
          description: Timestamp of when the object was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of when the object was last updated.
      required:
      - id
      - createdBy
      - createdByEmail
      - note
      - projectId
      - createdAt
      - updatedAt
    CustomTextFieldCollection:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - text
        customTextId:
          type: integer
        value:
          type: string
          nullable: true
      required:
      - name
      - type
      - customTextId
      - value
    CustomCheckboxFieldCollection:
      type: object
      properties:
        name:
          type: string
        type:
          type: string
          enum:
          - checkbox
        customCheckboxId:
          type: integer
        value:
          type: boolean
      required:
      - name
      - type
      - customCheckboxId
      - value
    Unauthorized:
      type: object
      properties:
        error:
          type: string
          enum:
          - Unauthorized
        message:
          type: string
          enum:
          - Unauthorized
        statusCode:
          type: number
          enum:
          - 401
      required:
      - error
      - message
      - statusCode
    BadRequest:
      type: object
      properties:
        error:
          type: string
          enum:
          - Bad Request
        message:
          type: string
        statusCode:
          type: number
          enum:
          - 400
      required:
      - error
      - message
      - statusCode
    ModifiedAfter:
      description: 'If provided, will only return objects modified after this timestamp. Format: YYYY-MM-DD or YYYY-MM-DDTHH:MM:SSZ.'
      anyOf:
      - format: date
        type: string
      - format: date-time
        type: string
    Actual:
      type: object
      properties:
        id:
          description: The unique identifier for the actual
          type: integer
        date:
          type: string
          format: date
          description: 'The date the actual took place. Format: YYYY-MM-DD'
        billableMinutes:
          description: The number of billable minutes for the actual
          type: number
        nonbillableMinutes:
          description: The number of nonbillable minutes for the actual
          type: number
        billableNote:
          description: A note or comment related to the billable minutes, if any.
          type: string
          nullable: true
        nonbillableNote:
          description: A note or comment related to the nonbillable minutes, if any.
          type: string
          nullable: true
        phaseId:
          description: The ID referencing the phase of the actual, if applicable.
          type: number
          nullable: true
        personId:
          description: The ID referencing the person associated with the actual.
          type: number
        projectId:
          description: The ID referencing the project associated with the actual.
          type: number
        roleId:
          description: The ID referencing the role associated with the actual.
          type: number
        workstreamId:
          description: The ID referencing the workstream of the actual. `null` when the actual has no workstream, in which case it appears under No Workstream in Runn.
          type: number
          nullable: true
        createdAt:
          type: string
          format: date-time
          description: Timestamp of when the object was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of when the object was last updated.
      required:
      - id
      - date
      - billableMinutes
      - nonbillableMinutes
      - billableNote
      - nonbillableNote
      - phaseId
      - personId
      - projectId
      - roleId
      - workstreamId
      - createdAt
      - updatedAt
    NotFound:
      type: object
      properties:
        error:
          type: string
          enum:
          - Not Found
        message:
          type: string
        statusCode:
          type: number
          enum:
          - 404
      required:
      - error
      - message
      - statusCode
    ProjectBudgetRole:
      description: Project budget role
      type: object
      properties:
        projectId:
          type: integer
        roleId:
          type: integer
        estimatedMinutes:
          description: 'Estimated Minutes: The total number of minutes budgeted for a role on a project.'
          type: integer
        estimatedBudget:
          description: The budget in local currency. This value is calculated live and rounded using ROUND_HALF_UP. estimatedBudget = estimatedMinutes / 60 * projectRateMinute
          type: integer
        createdAt:
          type: string
          format: date-time
          description: Timestamp of when the object was created.
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of when the object was last updated.
      required:
      - projectId
      - roleId
      - estimatedMinutes
      - estimatedBudget
      - createdAt
      - updatedAt
    ProjectPhase:
      title: Project Phase
      description: Project phases divide your project into smaller sections so you can group similar tasks and assignments together.
      type: object
      properties:
        id:
          description: Unique identifier for the phase
          type: number
        name:
          description: The name of the project phase
          type: string
        color:
          description: Color of the project phase (hex code)
          type: string
        startDate:
          type: string
          format: date
          description: Start date of the project phase in ISO 8601 format
        endDate:
          type: string
          format: date
          description: End date of the phase in ISO 8601 format
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of when the object was last updated.
        createdAt:
          type: string
          format: date-time
          description: Timestamp of when the object was created.
        projectId:
          description: The project the phase is associated with.
          type: number
        budget:
          description: 'The budget for the phase. This is returned when the project''s budget method is set to ''PHASE'' or ''PHASE_AND_ROLE'', and is null when it is set to ''ROLE''. Note: for ''PHASE_AND_ROLE'' the budget is derived from role estimates and rates held on related records, so it can change without updating the phase''s `updatedAt` and is therefore not picked up by the `modifiedAfter` filter.'
          type: number
          nullable: true
      required:
      - id
      - name
      - color
      - startDate
      - endDate
      - updatedAt
      - createdAt
      - projectId
      - budget
    CollectionPerson:
