openapi: 3.2.0
info:
  title: Runn Projects API
  version: 1.0.0
  description: 'See the full documentation and guide to using the Runn API.


    The domain for your API endpoint can be found in Accounts > Settings > API in your Runn application'
servers:
- url: https://api.runn.io
  description: EU Server
- url: https://api.us.runn.io
  description: US Server
security:
- bearerAuth: []
tags:
- name: Projects
paths:
  /projects/{projectId}:
    get:
      operationId: getProject
      summary: Show a project
      parameters:
      - schema:
          type: integer
        in: path
        name: projectId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - Projects
    patch:
      operationId: updateProject
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  minLength: 1
                  type: string
                isConfirmed:
                  type: boolean
                isArchived:
                  type: boolean
                isTemplate:
                  type: boolean
                budget:
                  minimum: 0
                  description: Budget value in local currency
                  type: number
                expensesBudget:
                  minimum: 0
                  description: Expenses budget value in local currency
                  type: number
                clientId:
                  type: number
                teamId:
                  type: number
                  nullable: true
                pricingModel:
                  type: string
                  enum:
                  - fp
                  - tm
                  - nb
                rateType:
                  type: string
                  enum:
                  - hours
                  - days
                references:
                  type: array
                  items:
                    $ref: '#/components/schemas/Reference'
                tags:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: integer
                    required:
                    - id
                managerIds:
                  description: List of User IDs that manage the project.
                  uniqueItems: true
                  type: array
                  items:
                    type: integer
      parameters:
      - schema:
          type: integer
        in: path
        name: projectId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - Projects
  /projects/:
    get:
      operationId: listProjects
      summary: List projects
      description: See `GET /people/{id}/projects` for all projects by person
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Cursor for paginated requests
      - schema:
          default: 50
          minimum: 1
          maximum: 200
          type: integer
        in: query
        name: limit
        required: false
        description: The number of results per page
      - schema:
          type: string
          enum:
          - createdAt
          - updatedAt
          - id
          default: id
        in: query
        name: sortBy
        required: false
        description: 'Field to sort by: createdAt or updatedAt or id'
      - schema:
          type: string
          enum:
          - asc
          - desc
          default: asc
        in: query
        name: order
        required: false
        description: 'Sort order: asc or desc'
      - schema:
          default: true
          type: boolean
        in: query
        name: includeArchived
        required: true
      - schema:
          $ref: '#/components/schemas/ModifiedAfter'
        in: query
        name: modifiedAfter
        required: false
      - schema:
          type: string
        in: query
        name: externalId
        required: false
        description: External ID value
      - schema:
          type: string
        in: query
        name: name
        required: false
        description: Case-insensitive substring match on project name (e.g. `Acme`).
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - values
                - nextCursor
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      tags:
      - Projects
    post:
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                properties:
                  emoji:
                    type: string
                  name:
                    minLength: 1
                    type: string
                  isConfirmed:
                    type: boolean
                  isTemplate:
                    type: boolean
                  budget:
                    minimum: 0
                    description: Budget value in local currency
                    type: number
                  expensesBudget:
                    minimum: 0
                    description: Expenses budget value in local currency
                    type: number
                  clientId:
                    type: number
                  teamId:
                    type: number
                    nullable: true
                  pricingModel:
                    type: string
                    enum:
                    - fp
                    - tm
                    - nb
                    description: Defaults to 'tm' if not specified
                  rateCardId:
                    description: Used to create initial project rates. Uses standard rate card if not specified
                    type: integer
                  rateType:
                    type: string
                    enum:
                    - hours
                    - days
                    description: Defaults to account rate type if not specified
                  references:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reference'
                  managerIds:
                    description: List of User IDs that manage the project.
                    uniqueItems: true
                    type: array
                    items:
                      type: integer
                required:
                - name
                - clientId
              - type: object
                properties:
                  fromTemplate:
                    type: object
                    properties:
                      templateId:
                        description: ID of the template project to duplicate
                        type: integer
                      startDate:
                        description: New start date for the project
                        format: date
                        type: string
                    required:
                    - templateId
                    - startDate
                  name:
                    minLength: 1
                    type: string
                  clientId:
                    type: number
                required:
                - fromTemplate
      parameters:
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '201':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      tags:
      - Projects
  /projects/custom-fields:
    get:
      operationId: listProjectCustomFields
      summary: List project custom fields
      description: List all custom fields across all projects
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Cursor for paginated requests
      - schema:
          default: 100
          minimum: 1
          maximum: 500
          type: integer
        in: query
        name: limit
        required: false
        description: The number of results per page
      - schema:
          $ref: '#/components/schemas/ModifiedAfter'
        in: query
        name: modifiedAfter
        required: false
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectCustomField'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - values
                - nextCursor
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      tags:
      - Projects
  /projects/{projectId}/:
    delete:
      operationId: deleteProject
      summary: Delete a project
      description: Delete a project by id. You cannot delete a project that has any actuals or assignments.
      parameters:
      - schema:
          type: integer
        in: path
        name: projectId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '204':
          description: Successful deletion of the project.
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '409':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
      tags:
      - Projects
  /projects/{projectId}/actuals/:
    get:
      operationId: listProjectActuals
      summary: List actuals for a project
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Cursor for paginated requests
      - schema:
          default: 50
          minimum: 1
          maximum: 200
          type: integer
        in: query
        name: limit
        required: false
        description: The number of results per page
      - schema:
          type: integer
        in: query
        name: personId
        required: false
      - schema:
          type: integer
        in: query
        name: roleId
        required: false
      - schema:
          $ref: '#/components/schemas/ModifiedAfter'
        in: query
        name: modifiedAfter
        required: false
      - schema:
          type: integer
        in: path
        name: projectId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      $ref: '#/components/schemas/Actual'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - values
                - nextCursor
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - Projects
  /projects/{projectId}/assignments/:
    get:
      operationId: listProjectAssignments
      summary: List assignments for a project
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Cursor for paginated requests
      - schema:
          default: 50
          minimum: 1
          maximum: 200
          type: integer
        in: query
        name: limit
        required: false
        description: The number of results per page
      - schema:
          type: integer
        in: query
        name: personId
        required: false
      - schema:
          type: integer
        in: query
        name: roleId
        required: false
      - schema:
          type: string
          format: date
        in: query
        name: startDate
        required: false
        description: 'Include assignments that start or overlap with this date. Format: YYYY-MM-DD'
      - schema:
          type: string
          format: date
        in: query
        name: endDate
        required: false
        description: 'Include assignments that end on or overlap with this date. Format: YYYY-MM-DD'
      - schema:
          $ref: '#/components/schemas/ModifiedAfter'
        in: query
        name: modifiedAfter
        required: false
      - schema:
          type: integer
        in: path
        name: projectId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      $ref: '#/components/schemas/Assignment'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - values
                - nextCursor
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - Projects
  /projects/{projectId}/budget-roles/{roleId}:
    get:
      operationId: getProjectBudgetRole
      summary: Get a project budget role
      parameters:
      - schema:
          type: integer
        in: path
        name: projectId
        required: true
      - schema:
          type: integer
        in: path
        name: roleId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Project budget role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBudgetRole'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - Projects
    patch:
      operationId: updateProjectBudgetRole
      summary: Update a project budget role
      description: Update a project budget role for a project. You cannot update a project budget role using estimated budget if a project rate does not exist for the role because the project rate is used to set the estimatedMinutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                properties:
                  estimatedMinutes:
                    minimum: 0
                    type: integer
                required:
                - estimatedMinutes
              - type: object
                properties:
                  estimatedBudget:
                    minimum: 0
                    type: integer
                required:
                - estimatedBudget
      parameters:
      - schema:
          type: integer
        in: path
        name: projectId
        required: true
      - schema:
          type: integer
        in: path
        name: roleId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Project budget role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectBudgetRole'
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - Projects
    delete:
      operationId: deleteProjectBudgetRole
      summary: Delete a project budget role
      description: Delete a project budget role for a project. You cannot delete a project budget role if it is implicitly created from a project membership.
      parameters:
      - schema:
          type: integer
        in: path
        name: projectId
        required: true
      - schema:
          type: integer
        in: path
        name: roleId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '204':
          description: Default Response
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '409':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
      tags:
      - Projects
  /projects/{projectId}/budget-roles/:
    get:
      operationId: listProjectBudgetRoles
      summary: Get a paginated list of project budget roles for a project
      parameters:
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: Cursor for paginated requests
      - schema:
          default: 50
          minimum: 1
          maximum: 200
          type: integer
        in: query
        name: limit
        required: false
        description: The number of results per page
      - schema:
          type: integer
        in: path
        name: projectId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  values:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectBudgetRole'
                  nextCursor:
                    type: string
                    nullable: true
                required:
                - values
                - nextCursor
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - Projects
    post:
      operationId: createProjectBudgetRole
      summary: Create a project budget role
      description: Create a project budget role for a project. You cannot create a project budget role using estimated budget if a project rate does not exist for the role because the project rate is used to set the estimatedMinutes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - type: object
                properties:
                  roleId:
                    type: integer
                required:
                - roleId
              - anyOf:
                - type: object
                  properties:
                    estimatedMinutes:
                      minimum: 0
                      type: integer
                  required:
                  - estimatedMinutes
                - type: object
                  properties:
                    estimatedBudget:
                      minimum: 0
                      type: integer
                  required:
                  - estimatedBudget
      parameters:
      - schema:
          type: integer
        in: path
        name: projectId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '201':
          description: Default Response
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '409':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
      tags:
      - Projects
  /projects/{projectId}/custom-fields/checkbox/:
    patch:
      operationId: updateProjectCheckboxCustomFields
      summary: Add a checkbox custom value to a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: number
                value:
                  type: boolean
              required:
              - id
              - value
      parameters:
      - schema:
          type: integer
        in: path
        name: projectId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                  value:
                    type: boolean
                required:
                - id
                - value
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
        '404':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
      tags:
      - Projects
  /projects/{projectId}/custom-fields/date/:
    patch:
      operationId: updateProjectDateCustomFields
      summary: Add a date custom field value to a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: number
                value:
                  type: string
                  format: date
                  description: 'Format: YYYY-MM-DD'
                  nullable: true
              required:
              - id
              - value
      parameters:
      - schema:
          type: integer
        in: path
        name: projectId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                  value:
                    type: string
                    format: date
                    description: 'Format: YYYY-MM-DD'
                    nullable: true
                required:
                - id
                - value
        '400':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '401':
          description: Default Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Unauthorized'
      tags:
      - Projects
  /projects/{projectId}/custom-fields/select/:
    patch:
      operationId: updateProjectSelectCustomFields
      summary: Add a select custom field to a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: number
                values:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: number
                    required:
                    - id
              required:
              - id
              - values
      parameters:
      - schema:
          type: integer
        in: path
        name: projectId
        required: true
      - schema:
          default: 1.0.0
          enum:
          - 1.0.0
        in: header
        name: accept-version
        required: true
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: number
                  values:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: number
                      required:
                      - id
                required:
                - id
                - values
        '400':
          description: Default Response
          content:
            application/json:
              schema:
